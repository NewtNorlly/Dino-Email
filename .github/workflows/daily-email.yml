name: Dino Daily Blessing Email

on:
  schedule:
    # 每 5 分钟一次（GitHub Actions 最短间隔）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send one test email
        env:
          MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
        run: python dino_broadcast.py --send --limit 1 --retries 1 --retry-delay 10
