name: Dino Daily Blessing Email

on:
  schedule:
    # 北京时间每天 07:30（UTC 23:30）
    - cron: '30 23 * * *'
  workflow_dispatch:  # 支持手动触发

# 防止上一次还没跑完就触发下一次
concurrency:
  group: dino-email
  cancel-in-progress: false

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send daily emails to all recipients
        env:
          MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
        run: python dino_broadcast.py --send --retries 3 --retry-delay 45
