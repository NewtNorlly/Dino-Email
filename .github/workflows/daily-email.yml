name: Dino Daily Blessing Email

on:
  schedule:
    # 北京时间 每天 10:20 (UTC+8) = UTC 02:20
    - cron: '20 2 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  send-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Send daily blessing emails
        env:
          MATON_API_KEY: ${{ secrets.MATON_API_KEY }}
        run: python dino_broadcast.py --send
